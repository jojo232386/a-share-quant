name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # Gate E isolation is enforced with Apple's sandbox-exec; use the same OS
    # family as the audited release gate instead of treating its absence on
    # Linux as a product failure.
    runs-on: macos-latest
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check lockfile
        run: uv lock --check

      - name: Check committed whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # `github.event.before` is only guaranteed to be reachable after a
          # fast-forward push.  An amend, rebase, or force-push orphans it, and
          # the runner's fresh clone never fetches it, so push events opt into
          # a whole-tree scan as the fallback base.  That escalates the check
          # instead of skipping it; committed whitespace errors still fail.
          case "$EVENT_NAME" in
            pull_request) set -- "$PR_BASE_SHA" "$HEAD_SHA" ;;
            push) set -- --fallback-whole-tree "$PUSH_BEFORE_SHA" "$HEAD_SHA" ;;
            workflow_dispatch) set -- "origin/$DEFAULT_BRANCH" "$HEAD_SHA" ;;
            *) echo "unsupported GitHub event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          ./scripts/check_committed_whitespace.sh "$@"

      - name: Test CI helper scripts
        run: tests/scripts/test_check_committed_whitespace.sh

      - name: Run unit and integration tests
        run: uv run --no-sync pytest -q

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Build wheel
        run: uv build
